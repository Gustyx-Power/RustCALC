[package]
name = "rustcalc"
version = "0.1.0"
edition = "2024"
authors = ["Gustyx"]
description = "RustCALC - Scientific Calculator in pure Rust with egui"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
